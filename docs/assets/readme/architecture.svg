<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="872" viewBox="0 0 1120 872" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">Memoria · 사진의 색을 기기 안에서 완성</title><desc id="desc">편집 화면은 recipe를 만들고, 이미지 엔진은 미리보기와 원본을 렌더링합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#287B68" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="872" rx="24" fill="#FAFBFC" stroke="#E2E7EC"/><rect x="0" y="0" width="1120" height="152" rx="24" fill="#182432" stroke="none"/><rect x="0" y="116" width="1120" height="36" rx="0" fill="#182432" stroke="none"/><text x="40" y="38" font-size="13" fill="#A8BCCB" font-weight="650">SYSTEM OVERVIEW</text><text x="40" y="85" font-size="34" fill="#FFFFFF" font-weight="650">Memoria · 사진의 색을 기기 안에서 완성</text><text x="40" y="122" font-size="17" fill="#CFD9E2" font-weight="400">편집 화면은 recipe를 만들고, 이미지 엔진은 미리보기와 원본을 렌더링합니다.</text><rect x="40" y="190" width="300" height="136" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="217" font-size="12" fill="#287B68" font-weight="650">INTERFACE</text><text x="60" y="247" font-size="22" fill="#202B38" font-weight="650">Flutter 편집기</text><text x="60" y="274" font-size="16" fill="#657180" font-weight="400">슬라이더 · 필터 · 크롭</text><text x="60" y="299" font-size="16" fill="#657180" font-weight="400">작업 기록과 draft 복구</text><rect x="410" y="190" width="300" height="136" rx="14" fill="#EAF5F0" stroke="#287B68"/><text x="430" y="217" font-size="12" fill="#287B68" font-weight="650">EDIT STATE</text><text x="430" y="247" font-size="22" fill="#202B38" font-weight="650">EditorRenderRecipe</text><text x="430" y="274" font-size="16" fill="#657180" font-weight="400">현재 보정값의 불변 스냅샷</text><text x="430" y="299" font-size="16" fill="#657180" font-weight="400">같은 엔진에 전달</text><rect x="780" y="190" width="300" height="136" rx="14" fill="#EAF5F0" stroke="#287B68"/><text x="800" y="217" font-size="12" fill="#287B68" font-weight="650">RENDER</text><text x="800" y="247" font-size="22" fill="#202B38" font-weight="650">Dart 이미지 엔진</text><text x="800" y="274" font-size="16" fill="#657180" font-weight="400">LUT · 색 · 부분 · 인물 보정</text><text x="800" y="299" font-size="16" fill="#657180" font-weight="400">프레임 · 텍스트 합성</text><path d="M346 258 L402 258" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><path d="M716 258 L772 258" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><text x="40" y="379" font-size="17" fill="#287B68" font-weight="650">하나의 recipe, 두 가지 해상도</text><rect x="40" y="401" width="506" height="134" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="428" font-size="12" fill="#287B68" font-weight="650">PREVIEW</text><text x="60" y="458" font-size="22" fill="#202B38" font-weight="650">미리보기 isolate</text><text x="60" y="485" font-size="16" fill="#657180" font-weight="400">긴 변 720px · 편집 화면에 표시</text><text x="60" y="510" font-size="16" fill="#657180" font-weight="400">작업 기록은 최대 100개, draft는 500ms 뒤 저장</text><rect x="574" y="401" width="506" height="134" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="594" y="428" font-size="12" fill="#287B68" font-weight="650">EXPORT</text><text x="594" y="458" font-size="22" fill="#202B38" font-weight="650">내보내기 isolate</text><text x="594" y="485" font-size="16" fill="#657180" font-weight="400">원본 해상도 · 사진 앱 저장과 공유</text><text x="594" y="510" font-size="16" fill="#657180" font-weight="400">JPEG / PNG / TIFF: Dart · WebP: Swift ImageIO</text><path d="M930 332 V355 H290 V393 M930 355 H828 V393" fill="none" stroke="#287B68" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="582" font-size="17" fill="#287B68" font-weight="650">나만의 필터 · 별도 생성 경로</text><rect x="40" y="604" width="300" height="126" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="638" font-size="22" fill="#202B38" font-weight="650">참조 사진</text><text x="60" y="668" font-size="16" fill="#657180" font-weight="400">한 장 · 여러 장</text><text x="60" y="693" font-size="16" fill="#657180" font-weight="400">또는 보정 전후 한 쌍</text><rect x="410" y="604" width="300" height="126" rx="14" fill="#EAF5F0" stroke="#287B68"/><text x="430" y="638" font-size="22" fill="#202B38" font-weight="650">LUT 생성 isolate</text><text x="430" y="668" font-size="16" fill="#657180" font-weight="400">LiteRT 또는 색 변환 알고리즘</text><text x="430" y="693" font-size="16" fill="#657180" font-weight="400">65³ LUT로 정리</text><rect x="780" y="604" width="300" height="126" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="800" y="638" font-size="22" fill="#202B38" font-weight="650">필터 라이브러리</text><text x="800" y="668" font-size="16" fill="#657180" font-weight="400">썸네일까지 성공하면 등록</text><text x="800" y="693" font-size="16" fill="#657180" font-weight="400">LUT · recipe · 메타데이터</text><path d="M346 667 L402 667" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><path d="M716 667 L772 667" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="756" width="1040" height="64" rx="12" fill="#EAF5F0" stroke="none"/><text x="60" y="782" font-size="17" fill="#287B68" font-weight="650">사진 편집과 필터 생성은 온디바이스</text><text x="60" y="805" font-size="15" fill="#657180" font-weight="400">학습은 ml_pipeline에서 별도로 진행합니다. 인물 분할 모델은 최초 필요 시 내려받습니다.</text><text x="40" y="849" font-size="13" fill="#657180" font-weight="400">SOURCE  lib/features/editor · lib/features/create_filter · lib/engine · lib/ai</text></svg>