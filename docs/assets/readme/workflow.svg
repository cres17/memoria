<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">Memoria · 필터 생성</title><desc id="desc">Memoria · 필터 생성</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#163D51" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="704" rx="12" fill="#FAFCFD" stroke="#D7E5EB"/><path d="M12 0 H1108 Q1120 0 1120 12 V64 H0 V12 Q0 0 12 0 Z" fill="#176D96"/><text x="560" text-anchor="middle" y="42" font-size="25" fill="#FFFFFF" font-weight="600">Memoria · 필터 생성</text><g transform="translate(0 -80)"><text x="40" y="184" font-size="16" fill="#176D96" font-weight="600">한 장의 참조 사진</text><rect x="40" y="202" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><text x="60" y="236" font-size="22" fill="#202B38" font-weight="600">사진 1장</text><text x="60" y="266" font-size="16" fill="#657180" font-weight="400">번들 모델 설치 상태 확인</text><path d="M373 262 L390 262" fill="none" stroke="#176D96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="396" y="202" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><text x="416" y="236" font-size="22" fill="#202B38" font-weight="600">LiteRT 추론</text><text x="416" y="266" font-size="16" fill="#657180" font-weight="400">실패하면 알고리즘으로 대체</text><path d="M729 262 L746 262" fill="none" stroke="#176D96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="752" y="202" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><text x="772" y="236" font-size="22" fill="#202B38" font-weight="600">17³ → 65³ LUT</text><text x="772" y="266" font-size="16" fill="#657180" font-weight="400">모델 추론 결과를 보간</text><text x="40" y="364" font-size="16" fill="#176D96" font-