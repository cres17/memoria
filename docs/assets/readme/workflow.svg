<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="732" viewBox="0 0 1120 732" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">Memoria · 필터 생성</title><desc id="desc">Memoria · 필터 생성</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#287B68" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="732" rx="24" fill="#FAFBFC" stroke="#E2E7EC"/><rect x="0" y="0" width="1120" height="100" rx="24" fill="#182432" stroke="none"/><text x="40" y="64" font-size="34" fill="#FFFFFF" font-weight="650">Memoria · 필터 생성</text><g transform="translate(0 -52)"><text x="40" y="184" font-size="16" fill="#287B68" font-weight="650">한 장의 참조 사진</text><rect x="40" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="236" font-size="22" fill="#202B38" font-weight="650">사진 1장</text><text x="60" y="266" font-size="16" fill="#657180" font-weight="400">번들 모델 설치 상태 확인</text><path d="M373 262 L390 262" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="236" font-size="22" fill="#202B38" font-weight="650">LiteRT 추론</text><text x="416" y="266" font-size="16" fill="#657180" font-weight="400">실패하면 알고리즘으로 대체</text><path d="M729 262 L746 262" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="236" font-size="22" fill="#202B38" font-weight="650">17³ → 65³ LUT</text><text x="772" y="266" font-size="16" fill="#657180" font-weight="400">모델 추론 결과를 보간</text><text x="40" y="364" font-size="16" fill="#287B68" font-weight="650">다른 두 가지 입력</text><rect x="40" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="416" font-size="22" fill="#202B38" font-weight="650">여러 장 또는 전후 한 쌍</text><text x="60" y="446" font-size="16" fill="#657180" font-weight="400">입력 방식 선택</text><path d="M373 442 L390 442" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="416" font-size="22" fill="#202B38" font-weight="650">통계 결합 / 대응 픽셀</text><text x="416" y="446" font-size="16" fill="#657180" font-weight="400">다중 참조 / affine + residual</text><path d="M729 442 L746 442" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="416" font-size="22" fill="#202B38" font-weight="650">65³ LUT</text><text x="772" y="446" font-size="16" fill="#657180" font-weight="400">생성 방식과 대체 이유 기록</text><text x="40" y="544" font-size="16" fill="#287B68" font-weight="650">공통 저장 단계</text><rect x="40" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="596" font-size="22" fill="#202B38" font-weight="650">LUT 생성 완료</text><text x="60" y="626" font-size="16" fill="#657180" font-weight="400">별도 isolate · 45초 제한</text><path d="M373 622 L390 622" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="596" font-size="22" fill="#202B38" font-weight="650">썸네일 렌더 검증</text><text x="416" y="626" font-size="16" fill="#657180" font-weight="400">취소 · 실패 시 정리</text><path d="M729 622 L746 622" fill="none" stroke="#287B68" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="596" font-size="22" fill="#202B38" font-weight="650">필터 등록</text><text x="772" y="626" font-size="16" fill="#657180" font-weight="400">LUT · 썸네일 · recipe 저장</text><text x="40" y="761" font-size="13" fill="#657180" font-weight="400">사진을 외부 서버로 전송하지 않는 필터 생성 경로입니다.</text></g></svg>