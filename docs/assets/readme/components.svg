<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="764" viewBox="0 0 1120 764" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">기술 구성과 담당 기능</title><desc id="desc">사진과 화면: Flutter · go_router, 홈 · 필터 목록 · 편집, 필터 생성 · 설정; photo_manager · image_picker, 보관함 접근 · 사진 선택, 권한 확인; gal · share_plus, 완성 사진 보관함 저장, 다른 앱으로 공유; google_mobile_ads, 배너 · 전면 광고, 기능별 flag · 기본 꺼짐. 편집과 추론: EditorRenderRecipe, 노출 · 커브 · HSL · LUT, 편집값을 하나의 객체로 전달; Dart isolate · image, 미리보기 / 원본 렌더링, 픽셀 연산 · 이미지 인코딩; LiteRT · MediaPipe, 필터 모델 기기 내 추론, 인물 영역 마스크; Swift · Core Image · ImageIO, MethodChannel 연결, 네이티브 LUT · WebP. 보관과 학습: SharedPreferences · JSON, 편집 초안 · 설정, 필터 LUT·썸네일·recipe; HTTP · crypto, 모델 파일 다운로드, 모델 무결성 확인; PyTorch · timm · torchvision, 학습과 특징 추출, NumPy · SciPy · Pillow; ONNX · TFLite 변환, 모델 변환·실행 확인, Flutter 테스트 · iOS 빌드</desc><rect width="1120" height="764" rx="12" fill="#FFFFFF"/><text x="28" y="40" font-size="24" font-weight="600" fill="#163D51">기술 구성과 담당 기능</text><path d="M28 60 H1092" stroke="#D7E5EB"/><rect x="28" y="84" width="332" height="654" rx="12" fill="#EAF4F9" fill-opacity="0.5" stroke="#D7E5EB"/><circle cx="50" cy="113" r="4" fill="#176D96"/><text x="64" y="119" font-size="18" font-weight="600" fill="#163D51">사진과 화면</text><g><rect x="42" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><path d="M58 158 v18" stroke="#176D96" stroke-width="3" stroke-linecap="round"/><text x="70" y="173" font-size="17" font-weight="600" fill="#163D51">Flutter · go_router</text><text x="58" y="208" font-size="16" fill="#53616C">홈 · 필터 목록 · 편집</text><text x="58" y="234" font-size="16" fill="#53616C">필터 생성 · 설정</text></g><g><rect x="42" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><path d="M58 304 v18" stroke="#176D96" stroke-width="3" stroke-linecap="round"/><text x="70" y="319" font-size="17" font-weight="600" fill="#163D51">photo_manager · image_picker</text><text x="58" y="354" font-size="16" fill="#53616C">보관함 접근 · 사진 선택</text><text x="58" y="380" font-size="16" fill="#53616C">권한 확인</text></g><g><rect x="42" y="432" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><path d="M58 450 v18" stroke="#176D96" stroke-width="3" stroke-linecap="round"/><text x="70" y="465" font-size="17" font-weight="600" fill="#163D51">gal · share_plus</text><text x="58" y="500" font-size="16" fill="#53616C">완성 사진 보관함 저장</text><text x="58" y="526" font-size="16" fill="#53616C">다른 앱으로 공유</text></g><g><rect x="42" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><path d="M58 596 v18" stroke="#176D96" stroke-width="3" stroke-linecap="round"/><text x="70" y="611" font-size="17" font-weight="600" fill="#163D51">google_mobile_ads</text><text x="58" y="646" font-size="16" fill="#53616C">배너 · 전면 광고</text><text x="58" y="672" font-size="16" fill="#53616C">기능별 flag · 기본 꺼짐</text></g><rect x="394" y="84" width="332" height="654" rx="12" fill="#EAF4F9" fill-opacity="0.5" stroke="#D7E5EB"/><circle cx="416" cy="113" r="4" fill="#176D96"/><text x="430" y="119" font-size="18" font-weight="600" fill="#163D51">편집과 추론</text><g><rect x="408" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><path d="M424 158 v18" stroke="#176D96" stroke-width="3" stroke-linecap="round"/><text x="436" y="173" font-size="17" font-weight="600" fill="#163D51">EditorRenderRecipe</text><text x="424" y="208" font-size="16" fill="#53616C">노출 · 커브 · HSL · LUT</text><text x="424" y="234" font-size="16" fill="#53616C">편집값을 하나의 객체로 전달</text></g><g><rect x="408" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D7E5EB"/><path d="M424 304 v18" stroke="#176D96" stroke-width="3" stroke-linecap="round"/><text x="436" y="319" font-size="17" font-weight="600" fill="#163D51">Dart isolate · image</text><text x="424" y="354" font-size="16" fill="#53616C">미리보기 / 원본 렌더링</text><text x="424" y="380" font-size="16" fill="#53616C">픽셀