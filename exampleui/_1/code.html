<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memoria - Edit Filter</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "primary-fixed": "#c9ebd2",
                "surface-container-highest": "#e3e2e0",
                "surface-tint": "#476551",
                "on-primary-fixed": "#032111",
                "on-primary-container": "#87a891",
                "surface-dim": "#dadad7",
                "surface-container-lowest": "#ffffff",
                "surface-container": "#eeeeeb",
                "on-background": "#1a1c1b",
                "on-surface": "#1a1c1b",
                "on-error-container": "#93000a",
                "secondary": "#556158",
                "background": "#faf9f7",
                "surface-variant": "#e3e2e0",
                "secondary-fixed-dim": "#bccabe",
                "tertiary-fixed": "#ffdadb",
                "on-surface-variant": "#424843",
                "error-container": "#ffdad6",
                "surface": "#faf9f7",
                "secondary-fixed": "#d8e6da",
                "tertiary-fixed-dim": "#efb9bc",
                "surface-container-low": "#f4f4f1",
                "inverse-surface": "#2f312f",
                "primary-fixed-dim": "#adcfb6",
                "inverse-on-surface": "#f1f1ee",
                "primary": "#092717",
                "on-tertiary": "#ffffff",
                "on-tertiary-container": "#c69497",
                "secondary-container": "#d8e6da",
                "tertiary-container": "#512d30",
                "on-primary": "#ffffff",
                "on-secondary-fixed-variant": "#3d4a41",
                "tertiary": "#38181b",
                "on-secondary-fixed": "#131e17",
                "outline": "#727972",
                "on-tertiary-fixed-variant": "#633c3f",
                "on-tertiary-fixed": "#301215",
                "on-secondary-container": "#5b675e",
                "on-primary-fixed-variant": "#304d3b",
                "inverse-primary": "#adcfb6",
                "surface-bright": "#faf9f7",
                "primary-container": "#203d2b",
                "outline-variant": "#c2c8c1",
                "on-error": "#ffffff",
                "error": "#ba1a1a",
                "surface-container-high": "#e8e8e6",
                "on-secondary": "#ffffff"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "xs": "4px",
                "sm": "8px",
                "md": "16px",
                "gutter": "16px",
                "base": "8px",
                "lg": "24px",
                "xl": "32px",
                "margin": "24px"
        },
        "fontFamily": {
                "body-md": [
                        "Noto Serif"
                ],
                "label-md": [
                        "Source Serif 4"
                ],
                "headline-lg": [
                        "Domine"
                ],
                "headline-md": [
                        "Domine"
                ]
        },
        "fontSize": {
                "body-md": [
                        "16px",
                        {
                                "lineHeight": "1.6",
                                "fontWeight": "400"
                        }
                ],
                "label-md": [
                        "14px",
                        {
                                "lineHeight": "1.4",
                                "letterSpacing": "0.02em",
                                "fontWeight": "600"
                        }
                ],
                "headline-lg": [
                        "32px",
                        {
                                "lineHeight": "1.2",
                                "fontWeight": "700"
                        }
                ],
                "headline-md": [
                        "24px",
                        {
                                "lineHeight": "1.3",
                                "fontWeight": "600"
                        }
                ]
        }
},
    },
  }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container: Mobile Optimized, Full Height -->
<main class="relative w-full max-w-md mx-auto min-h-screen flex flex-col bg-background overflow-hidden shadow-2xl shadow-black/5">
<!-- Task-Focused Header (Suppresses Global Nav per rules for transactional screens) -->
<header class="flex justify-between items-center px-lg h-16 shrink-0 z-20">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high hover:bg-surface-variant transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">AI Filter</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-on-surface-variant">history</span>
</button>
</header>
<!-- Top Half: Canvas / Image Area -->
<section class="relative flex-1 px-lg pb-lg flex flex-col justify-center min-h-[353px] z-10">
<!-- Image Card with Tonal Ambient Shadow -->
<div class="relative w-full aspect-[4/5] rounded-[24px] overflow-hidden shadow-[0_8px_30px_rgba(9,39,23,0.12)] bg-surface-container-highest transition-all duration-500 ease-out">
<!-- Filtered Image Background -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A beautifully processed vintage-style photograph of a quiet, sunlit interior space with dried flowers. The image exhibits a sophisticated 'Cloud Dancer' aesthetic with warm, muted terracotta undertones, creamy highlights, and a distinct, tactile film grain. The lighting is soft and natural, evoking a sense of calm, nostalgia, and premium digital heirloom quality." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBTFX_fzYT6I55tfDGWVavCeZfyc4QASmOmymNIF-5kyqdnlyUplckowKVGKUjCU6Hlu1DSrtknt93BUcJZ9QedgzCz15oX-ymrqvwhZfDsX842FoOtiAfPxFegDgY0I0cBY-Y5QvJSiOH5MbFtPxoNH1ktAZ3lGDrAI6OJD6ARIBAXwVSE-tL812VrM2JQjgA54Rqd802XWmKZfh9ZftnAPnBJqFeCg4Ri7xz1Q8kgDIrItXCOEJxMxr_Bo6G8y6vzebnm_Ud123WG');">
</div>
<!-- Subtle Overlay for depth -->
<div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent pointer-events-none"></div>
<!-- Compare Toggle Chip (Floating) -->
<button class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-surface-container-lowest/90 backdrop-blur-md px-5 py-2.5 rounded-full flex items-center gap-2 border border-outline-variant/30 active:scale-95 transition-all shadow-sm group hover:bg-surface-container-lowest">
<span class="material-symbols-outlined text-[20px] text-primary group-active:rotate-180 transition-transform duration-300">compare</span>
<span class="font-label-md text-label-md text-on-surface uppercase tracking-widest">Compare</span>
</button>
</div>
</section>
<!-- Bottom Half: Minimalist Control Panel (Cloud Dancer Palette via Surface Colors) -->
<section class="bg-surface-container-lowest rounded-t-[40px] px-lg py-lg shrink-0 shadow-[0_-10px_40px_rgba(0,0,0,0.04)] border-t border-outline-variant/10 flex flex-col gap-xl z-20 relative">
<!-- Dragger indicator -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 rounded-full bg-surface-variant"></div>
<!-- Sliders Stack -->
<div class="flex flex-col gap-lg pt-4">
<!-- Warmth Slider (Active State Focus) -->
<div class="flex flex-col gap-3 group">
<div class="flex justify-between items-center px-1">
<label class="font-body-md text-body-md font-medium text-on-surface">Warmth</label>
<span class="font-label-md text-label-md uppercase text-primary bg-primary-container/10 px-2 py-1 rounded-md">+45</span>
</div>
<!-- Thick, tactile track -->
<div class="relative w-full h-4 bg-surface-container-high rounded-full flex items-center cursor-pointer"><!-- Center Line Indicator -->
<div class="absolute left-1/2 -translate-x-1/2 w-0.5 h-full bg-outline-variant/50 z-10"></div>
<!-- Bi-directional Fill (Center to 65%) -->
<div class="absolute left-1/2 h-full bg-primary rounded-r-full transition-all duration-300" style="width: 15%;"></div>
<!-- Thumb -->
<div class="absolute h-8 w-8 bg-surface-container-lowest rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.15)] border border-outline-variant/20 top-1/2 -translate-y-1/2 flex items-center justify-center transition-transform group-active:scale-90 z-20" style="left: calc(65% - 16px);">
<div class="w-1 h-3 bg-surface-variant rounded-full"></div>
</div></div>
</div>
<!-- Grain Slider -->
<div class="flex flex-col gap-3 group">
<div class="flex justify-between items-center px-1">
<label class="font-body-md text-body-md font-medium text-on-surface-variant">Grain</label>
<span class="font-label-md text-label-md uppercase text-on-surface-variant bg-surface-container-high px-2 py-1 rounded-md">+20</span>
</div>
<div class="relative w-full h-4 bg-surface-container-high rounded-full flex items-center cursor-pointer"><!-- Center Line Indicator -->
<div class="absolute left-1/2 -translate-x-1/2 w-0.5 h-full bg-outline-variant/30 z-10"></div>
<!-- Bi-directional Fill (Center to 40%) -->
<div class="absolute right-1/2 h-full bg-secondary-fixed-dim rounded-l-full transition-all duration-300" style="width: 10%;"></div>
<!-- Thumb -->
<div class="absolute h-8 w-8 bg-surface-container-lowest rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.15)] border border-outline-variant/20 top-1/2 -translate-y-1/2 flex items-center justify-center transition-transform group-active:scale-90 z-20" style="left: calc(40% - 16px);"></div></div>
</div>
<!-- Intensity Slider -->
<div class="flex flex-col gap-3 group">
<div class="flex justify-between items-center px-1">
<label class="font-body-md text-body-md font-medium text-on-surface-variant">Intensity</label>
<span class="font-label-md text-label-md uppercase text-on-surface-variant bg-surface-container-high px-2 py-1 rounded-md">+85</span>
</div>
<div class="relative w-full h-4 bg-surface-container-high rounded-full flex items-center cursor-pointer"><!-- Center Line Indicator -->
<div class="absolute left-1/2 -translate-x-1/2 w-0.5 h-full bg-outline-variant/30 z-10"></div>
<!-- Bi-directional Fill (Center to 85%) -->
<div class="absolute left-1/2 h-full bg-secondary-fixed-dim rounded-r-full transition-all duration-300" style="width: 35%;"></div>
<!-- Thumb -->
<div class="absolute h-8 w-8 bg-surface-container-lowest rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.15)] border border-outline-variant/20 top-1/2 -translate-y-1/2 flex items-center justify-center transition-transform group-active:scale-90 z-20" style="left: calc(85% - 16px);"></div></div>
</div>
</div>
<!-- Primary Action -->
<div class="pt-sm pb-4">
<button class="w-full h-14 bg-primary text-on-primary font-body-md text-body-md font-semibold rounded-full active:scale-[0.98] transition-all duration-200 shadow-[0_4px_20px_rgba(9,39,23,0.25)] hover:shadow-[0_6px_25px_rgba(9,39,23,0.35)] flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
                    Save Filter
                </button>
</div>
</section>
</main>
</body></html>
