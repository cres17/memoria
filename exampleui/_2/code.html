<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface flex justify-between items-center w-full px-6 h-16 border-b border-surface-variant shadow-sm sticky top-0 z-40">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="auto_awesome">auto_awesome</span>
<h1 class="font-headline-md tracking-tight text-on-background">Memoria</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person">person</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-lg mx-auto px-margin-mobile py-stack-md flex flex-col gap-stack-lg pb-32">
<!-- Context Header -->
<div class="flex flex-col gap-1 text-center">
<h2 class="font-headline-md text-on-surface">Uncovering Details</h2>
<p class="font-body-md text-on-surface-variant">Extracting colors, tags, and sentiment.</p>
</div>
<!-- The Core: Image Analysis Container -->
<div class="relative w-full aspect-[4/5] bg-surface-container-high rounded-xl overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.04)] mx-auto">
<!-- Source Image -->
<img alt="Analyzing memory" class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 scale-[1.02]" data-alt="A cozy, sun-bleached photograph resting on a textured linen tablecloth, capturing a vintage 35mm film camera next to a half-empty cup of black coffee. The lighting is soft, warm, and natural, streaming in from an off-camera window, creating deep, comforting shadows. The visual style embodies a 'Digital Heirloom Minimalism' aesthetic, utilizing a harmonious color palette of soft whites, warm terracottas, and muted sage greens. The mood is nostalgic, calm, and intimate, perfectly suited for a high-end, memory-focused digital sanctuary." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2DaK87mOUBqQQuBXPPHbpBp49jwinD22FfEpdp1idGZRdshaxvDbFEJ5ImsyhpnWiXlL-4XIa2hvOQU0-DFhBqXce6soY2FhqsMOKvzqX7CF9TVsrlkqjJ9vQ-IVitaMosrAcZwTq67SAnOsTawpUsJ5LQyXx-PHOJ4f46vywqW4r67XX6JIYYliXdPku8q1XHiX-LdXsabwTG9dYwpFlF2_SdYgu6-q1WA61vzvDrdc0VoLWsemyKl__shRPHZMDKg3ZJfshqkPj"/>
<!-- Analysis Overlay Scrim -->
<div class="absolute inset-0 bg-primary/5 backdrop-blur-[1px] mix-blend-overlay"></div>
<!-- Static Representation of Scanning Line -->
<div class="absolute top-[40%] left-0 right-0 h-[2px] bg-[#1F3D2B] shadow-[0_0_12px_rgba(31,61,43,0.8)]"></div>
<div class="absolute top-[40%] left-0 right-0 h-[30%] bg-gradient-to-b from-[#1F3D2B]/20 to-transparent pointer-events-none mix-blend-overlay"></div>
<!-- Floating Status Pill -->
<div class="absolute bottom-stack-md left-1/2 -translate-x-1/2 bg-surface/90 backdrop-blur-md px-5 py-2.5 rounded-full flex items-center gap-2 shadow-[0_4px_20px_rgba(0,0,0,0.08)] border border-surface-variant">
<span class="material-symbols-outlined text-[#1F3D2B] text-sm fill" data-icon="blur_on">blur_on</span>
<span class="font-label-md text-on-surface tracking-wider">Analyzing</span>
</div>
</div>
<!-- Extraction Results (Bento Grid Style) -->
<div class="grid grid-cols-2 gap-base mt-2">
<!-- Palette Extraction -->
<div class="bg-surface-container-low rounded-xl p-stack-sm flex flex-col gap-stack-sm shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-white/50">
<div class="flex items-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="palette">palette</span>
<h3 class="font-label-md">Palette</h3>
</div>
<div class="flex gap-2 items-center justify-between mt-1">
<div class="w-8 h-8 rounded-full shadow-inner bg-[#402415]"></div>
<div class="w-8 h-8 rounded-full shadow-inner bg-[#b28975]"></div>
<div class="w-8 h-8 rounded-full shadow-inner bg-[#d0e8dc]"></div>
<div class="w-8 h-8 rounded-full shadow-inner bg-[#fcf9f1] border border-outline-variant"></div>
</div>
</div>
<!-- Entity Detection -->
<div class="bg-surface-container-low rounded-xl p-stack-sm flex flex-col gap-stack-sm shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-white/50">
<div class="flex items-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="category">category</span>
<h3 class="font-label-md">Detected</h3>
</div>
<div class="flex flex-wrap gap-1.5 mt-1">
<span class="px-2 py-1 bg-secondary/10 text-on-secondary-container font-label-md text-[10px] rounded-DEFAULT">Vintage</span>
<span class="px-2 py-1 bg-secondary/10 text-on-secondary-container font-label-md text-[10px] rounded-DEFAULT">Indoor</span>
<span class="px-2 py-1 bg-[#1F3D2B]/10 text-[#1F3D2B] font-label-md text-[10px] rounded-DEFAULT">Processing...</span>
</div>
</div>
</div>
<!-- Action / Processing Note -->
<div class="flex justify-center mt-stack-sm">
<button class="px-6 py-3 bg-surface-container rounded-full text-on-surface-variant font-body-md flex items-center gap-2 hover:bg-surface-variant transition-colors border border-outline-variant/30">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
                Cancel Upload
            </button>
</div>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-3 pb-8 bg-surface/90 backdrop-blur-md rounded-t-[32px] border-t border-surface-variant shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
<button class="flex flex-col items-center justify-center text-outline hover:text-on-surface active:scale-90 transition-all duration-300 ease-out gap-1">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-[10px] uppercase tracking-widest">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#1F3D2B]/10 text-[#1F3D2B] rounded-full px-4 py-2 hover:text-on-surface active:scale-90 transition-all duration-300 ease-out gap-1">
<span class="material-symbols-outlined fill" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-md text-[10px] uppercase tracking-widest">Create</span>
</button>
<button class="flex flex-col items-center justify-center text-outline hover:text-on-surface active:scale-90 transition-all duration-300 ease-out gap-1">
<span class="material-symbols-outlined" data-icon="filter_vintage">filter_vintage</span>
<span class="font-label-md text-[10px] uppercase tracking-widest">Edit</span>
</button>
<button class="flex flex-col items-center justify-center text-outline hover:text-on-surface active:scale-90 transition-all duration-300 ease-out gap-1">
<span class="material-symbols-outlined" data-icon="photo_library">photo_library</span>
<span class="font-label-md text-[10px] uppercase tracking-widest">Gallery</span>
</button>
</nav>
