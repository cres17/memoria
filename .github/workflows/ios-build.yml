name: iOS Build (CI)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          architecture: 'x64'

      - name: Check installed Flutter/Dart
        run: |
          flutter --version
          dart --version

      - name: Clean and remove old lock
        run: |
          flutter clean || true
          rm -f pubspec.lock || true

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS CocoaPods
        if: runner.os == 'macOS'
        run: |
          pushd ios
          pod install --repo-update
          popd

      - name: Check Flutter environment
        run: flutter doctor -v || true

      - name: Build iOS (no codesign)
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release --verbose 2>&1 | tee build_ios_verbose.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build_ios_verbose.log
