name: iOS Build (CI)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
          # macos-latest is Apple Silicon. Running the x64 SDK under Rosetta
          # made the neural-LUT integration test exceed its normal timeout.
          architecture: 'arm64'

      - name: Check installed Flutter/Dart
        run: |
          flutter --version
          dart --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify required runtime assets
        run: flutter test --no-pub test/runtime_assets_test.dart --reporter expanded

      - name: Analyze production and tests
        run: flutter analyze --no-fatal-infos

      - name: Test release signing configuration
        run: python3 -m unittest discover -s tool -p 'test_install_ios_provisioning_profile.py'

      - name: Run unit and widget tests
        run: flutter test --coverage --reporter compact

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: memoria-flutter-coverage
          path: coverage/lcov.info

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Build iOS simulator smoke app
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/SimulatorCI.xcconfig
        run: flutter build ios --simulator --debug

      - name: Boot iOS simulator
        run: |
          IOS_SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown/ {print $2; exit}')"
          test -n "$IOS_SIMULATOR_ID"
          xcrun simctl boot "$IOS_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          echo "IOS_SIMULATOR_ID=$IOS_SIMULATOR_ID" >> "$GITHUB_ENV"

      # Keep physical-device benchmarks and permission matrices out of this
      # deterministic simulator gate. Those suites require explicit device and
      # authorization-state inputs and publish separate evidence artifacts.
      - name: Run iOS simulator integration tests
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/SimulatorCI.xcconfig
        run: |
          set -euo pipefail
          flutter test integration_test/settings_recovery_ui_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact
          flutter test integration_test/editor_whitebox_device_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact
          flutter test integration_test/editor_performance_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact
          flutter test integration_test/ios_native_webp_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact

      - name: Build unsigned iOS release (no codesign)
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release --verbose 2>&1 | tee build_ipa_verbose.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoria-unsigned-ipa
          path: build/ios/iphoneos/Runner.app

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build_ipa_verbose.log
