name: iOS Build (CI)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
          # macos-latest is Apple Silicon. Running the x64 SDK under Rosetta
          # made the neural-LUT integration test exceed its normal timeout.
          architecture: 'arm64'

      - name: Check installed Flutter/Dart
        run: |
          flutter --version
          dart --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify required runtime assets
        run: |
          test -s assets/models/direct_mvp_color_transfer_fp16.tflite
          test "$(find assets/luts -name '*.bin' -type f | wc -l | tr -d ' ')" -ge 23
          test "$(find assets/images -name '*_thumb.jpg' -type f | wc -l | tr -d ' ')" -ge 24

      - name: Analyze production and tests
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --coverage --reporter compact

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: memoria-flutter-coverage
          path: coverage/lcov.info

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Build iOS simulator smoke app
        run: flutter build ios --simulator --debug

      - name: Boot iOS simulator
        run: |
          IOS_SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown/ {print $2; exit}')"
          test -n "$IOS_SIMULATOR_ID"
          xcrun simctl boot "$IOS_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          echo "IOS_SIMULATOR_ID=$IOS_SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run iOS integration tests
        run: >-
          flutter test integration_test
          --device-id "$IOS_SIMULATOR_ID"
          --reporter compact

      - name: Build unsigned iOS release (no codesign)
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release --verbose 2>&1 | tee build_ipa_verbose.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoria-unsigned-ipa
          path: build/ios/iphoneos/Runner.app

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build_ipa_verbose.log
