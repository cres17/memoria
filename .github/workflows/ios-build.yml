name: iOS Build (CI)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main, test/color-v3-fallback-routing ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-ios:
    name: iOS GPU parity and export timing (simulator)
    runs-on: macos-latest
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/SimulatorCI.xcconfig
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          architecture: 'arm64'
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Ensure Metal compiler is available
        run: |
          xcodebuild -downloadComponent metalToolchain
          xcrun metal --version
      - name: Test actual native GPU and export worker
        run: |
          mkdir -p build/gpu-safety
          xcrun swiftc ios/Runner/GpuRequestGate.swift tool/check_gpu_request_gate.swift -o build/gpu-safety/check
          build/gpu-safety/check
          python3 -B scripts/test_gpu_ci_startup.py
          python3 scripts/run_ios_gpu_ci.py
      - name: Verify Web keeps CPU without accessing isolate tokens
        run: flutter test --no-pub --platform chrome test/engine/gpu_isolate_context_test.dart
      - name: Upload GPU measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-gpu-simulator-evidence
          path: |
            build/ios-gpu-integration*.log
            build/ios-gpu-export.json
            build/ios-gpu-host.json
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/SimulatorCI.xcconfig
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
          # Run natively on Apple Silicon instead of using Rosetta.
          architecture: 'arm64'

      - name: Check installed Flutter/Dart
        run: |
          flutter --version
          dart --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify required runtime assets
        run: flutter test --no-pub test/runtime_assets_test.dart --reporter expanded

      - name: Analyze production and tests
        run: |
          python3 tool/prepare_gpu_test_photos.py
          flutter analyze --no-fatal-infos

      - name: Test release signing configuration
        run: python3 -m unittest discover -s tool -p 'test_install_ios_provisioning_profile.py'

      - name: Prepare pinned macOS inference test runtime
        run: |
          set -euo pipefail
          dart pub cache add flutter_litert --version 3.8.0
          TEST_TFLITE_LIB_PATH="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/flutter_litert-3.8.0/macos/flutter_litert/Sources/flutter_litert/Resources/libtensorflowlite_c-mac.dylib"
          printf '%s  %s\n' '6c574eb78a2eb814c6176d0a56967d2240e25706f732a04ad28f27020bb71a4f' "$TEST_TFLITE_LIB_PATH" | shasum -a 256 -c -
          echo "TFLITE_LIB_PATH=$TEST_TFLITE_LIB_PATH" >> "$GITHUB_ENV"

      - name: Run unit and widget tests
        run: flutter test --coverage --reporter compact

      # 기준 이미지 비교가 실패하면 실제 결과와 차이 이미지를 내려받아 눈으로 확인할 수 있게 한다.
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: build/visual_diff
          if-no-files-found: ignore

      # lcov 는 테스트가 불러온 파일만 포함하므로 실제 전체 커버리지보다 높게 나온다. 하한은 현재 값(60.0%)에서
      # 약간 낮춰 잡았고, 커버리지를 올리면 이 값도 같이 올린다.
      - name: Enforce coverage floor
        run: python3 scripts/check_coverage.py coverage/lcov.info --min 58

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memoria-flutter-coverage
          path: coverage/lcov.info

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Build iOS simulator smoke app
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/SimulatorCI.xcconfig
        run: flutter build ios --simulator --debug

      - name: Boot iOS simulator
        run: |
          IOS_SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown/ {print $2; exit}')"
          test -n "$IOS_SIMULATOR_ID"
          xcrun simctl boot "$IOS_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          echo "IOS_SIMULATOR_ID=$IOS_SIMULATOR_ID" >> "$GITHUB_ENV"

      # Keep physical-device benchmarks and permission matrices out of this
      # deterministic simulator gate. Those suites require explicit device and
      # authorization-state inputs and publish separate evidence artifacts.
      - name: Run iOS simulator integration tests
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/SimulatorCI.xcconfig
        run: |
          set -euo pipefail
          flutter test integration_test/settings_recovery_ui_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact
          flutter test integration_test/editor_whitebox_device_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact
          flutter test integration_test/editor_performance_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact
          flutter test integration_test/ios_native_webp_test.dart --device-id "$IOS_SIMULATOR_ID" --reporter compact

      - name: Build unsigned iOS release (no codesign)
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release --verbose 2>&1 | tee build_ipa_verbose.log

      - name: Verify privacy manifest is bundled
        run: |
          test -s build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          plutil -lint build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          # AdMob 앱 ID가 빌드 설정에서 치환되어 Info.plist 에 들어갔는지 확인한다.
          id=$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' build/ios/iphoneos/Runner.app/Info.plist)
          echo "GADApplicationIdentifier=$id"
          case "$id" in ca-app-pub-*~*) ;; *) echo "::error::AdMob app id was not substituted"; exit 1;; esac

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memoria-unsigned-ipa
          path: build/ios/iphoneos/Runner.app

      - name: Upload build logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-logs
          path: build_ipa_verbose.log
