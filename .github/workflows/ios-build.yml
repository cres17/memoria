name: iOS Build (CI)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-ios:
    name: iOS GPU parity and export timing (simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          architecture: 'arm64'
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Ensure Metal compiler is available
        run: |
          xcodebuild -downloadComponent metalToolchain
          xcrun metal --version
      - name: Test actual native GPU and export worker
        run: python3 scripts/run_ios_gpu_ci.py
      - name: Upload GPU measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-gpu-simulator-evidence
          path: |
            build/ios-gpu-integration.log
            build/ios-gpu-export.json
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
          # Run natively on Apple Silicon instead of using Rosetta.
          architecture: 'arm64'

      - name: Check installed Flutter/Dart
        run: |
          flutter --version
          dart --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify required runtime assets
        run: |
          test -s assets/models/direct_mvp_color_transfer_fp16.tflite
          test "$(find assets/luts -name '*.bin' -type f | wc -l | tr -d ' ')" -ge 23
          test "$(find assets/images -name '*_thumb.jpg' -type f | wc -l | tr -d ' ')" -ge 24

      - name: Analyze production and tests
        run: |
          python3 tool/prepare_gpu_test_photos.py
          flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --coverage --reporter compact

      # 기준 이미지 비교가 실패하면 실제 결과와 차이 이미지를 내려받아 눈으로 확인할 수 있게 한다.
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diff
          path: build/visual_diff
          if-no-files-found: ignore

      # lcov 는 테스트가 불러온 파일만 포함하므로 실제 전체 커버리지보다 높게 나온다. 하한은 현재 값(60.0%)에서
      # 약간 낮춰 잡았고, 커버리지를 올리면 이 값도 같이 올린다.
      - name: Enforce coverage floor
        run: python3 scripts/check_coverage.py coverage/lcov.info --min 58

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoria-flutter-coverage
          path: coverage/lcov.info

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Build iOS simulator smoke app
        run: flutter build ios --simulator --debug

      - name: Build unsigned iOS release (no codesign)
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release --verbose 2>&1 | tee build_ipa_verbose.log

      - name: Verify privacy manifest is bundled
        run: |
          test -s build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          plutil -lint build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          # AdMob 앱 ID가 빌드 설정에서 치환되어 Info.plist 에 들어갔는지 확인한다.
          id=$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' build/ios/iphoneos/Runner.app/Info.plist)
          echo "GADApplicationIdentifier=$id"
          case "$id" in ca-app-pub-*~*) ;; *) echo "::error::AdMob app id was not substituted"; exit 1;; esac

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoria-unsigned-ipa
          path: build/ios/iphoneos/Runner.app

      - name: Upload build logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-logs
          path: build_ipa_verbose.log
