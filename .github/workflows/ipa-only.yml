name: Build IPA (macOS runner)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
          architecture: 'x64'

      - name: Check installed Flutter/Dart
        run: |
          flutter --version
          dart --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          flutter build ios --no-codesign --release --verbose 2>&1 | tee build_ipa_verbose.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/ios/ipa/Payload
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          pushd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload memoria-unsigned.ipa
          popd

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoria-unsigned-ipa
          path: build/ios/ipa

      - name: Upload build logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoria-ipa-logs
          path: build_ipa_verbose.log
