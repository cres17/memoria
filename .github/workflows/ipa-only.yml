name: Build IPA (macOS runner)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.5'
          cache: true
          architecture: 'x64'

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS CocoaPods
        if: runner.os == 'macOS'
        run: |
          pushd ios
          pod install --repo-update
          popd

      - name: Build unsigned IPA
        run: flutter build ipa --no-codesign --release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoria-unsigned-ipa
          path: build/ios/ipa
