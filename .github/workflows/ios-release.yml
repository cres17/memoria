name: iOS Release Build (signed IPA)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*', 'release-*' ]

jobs:
  release-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Ensure Git LFS, submodules and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS CocoaPods
        if: runner.os == 'macOS'
        run: |
          pushd ios
          pod install --repo-update
          popd

      - name: Import signing identities and provisioning profiles
        uses: apple-actions/import-codesign@v1
        with:
          p12: ${{ secrets.IOS_CERT_P12 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}
          mobileprovision: ${{ secrets.IOS_PROVISIONING_PROFILE }}

      - name: Create exportOptions.plist
        run: |
          cat > exportOptions.plist <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <true/>
          </dict>
          </plist>
          PL

      - name: Build signed IPA
        env:
          FLUTTER_BUILD_MODE: release
        run: |
          flutter build ipa --export-options-plist=exportOptions.plist --release

      - name: Collect IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoria-ios-ipa
          path: build/ios/ipa
