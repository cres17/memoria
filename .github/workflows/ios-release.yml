name: iOS Release Build (signed IPA)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_dispatch:
  push:
    tags: [ 'v*', 'release-*' ]

permissions:
  contents: read

jobs:
  release-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          submodules: false

      - name: Ensure Git LFS and full history
        run: |
          git lfs install --skip-repo || true
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow || true
          fi
          git lfs pull || true
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
          architecture: 'arm64'

      - name: Check installed Flutter/Dart
        run: |
          flutter --version
          dart --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify required runtime assets
        run: flutter test --no-pub test/runtime_assets_test.dart --reporter expanded

      - name: Prepare pinned macOS inference test runtime
        run: |
          set -euo pipefail
          dart pub cache add flutter_litert --version 3.8.0
          TEST_TFLITE_LIB_PATH="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/flutter_litert-3.8.0/macos/flutter_litert/Sources/flutter_litert/Resources/libtensorflowlite_c-mac.dylib"
          printf '%s  %s\n' '6c574eb78a2eb814c6176d0a56967d2240e25706f732a04ad28f27020bb71a4f' "$TEST_TFLITE_LIB_PATH" | shasum -a 256 -c -
          echo "TFLITE_LIB_PATH=$TEST_TFLITE_LIB_PATH" >> "$GITHUB_ENV"

      - name: Analyze and test release source
        run: |
          python3 tool/prepare_gpu_test_photos.py
          python3 -m unittest discover -s tool -p 'test_install_ios_provisioning_profile.py'
          flutter analyze --no-fatal-infos
          flutter test --reporter compact

      - name: Validate store-release configuration
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
          ADVERTISING_RELEASE_MODE: ${{ vars.ADVERTISING_RELEASE_MODE }}
        run: |
          missing=0
          for name in IOS_CERT_P12 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE PRIVACY_POLICY_URL PRIVACY_CONTACT_EMAIL ADVERTISING_RELEASE_MODE; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing release configuration::$name must be configured before a signed store build can run."
              missing=1
            fi
          done
          case "$ADVERTISING_RELEASE_MODE" in
            disabled) ;;
            *)
              echo "::error title=Invalid advertising release mode::v1 is ad-free, so ADVERTISING_RELEASE_MODE must be exactly disabled."
              missing=1
              ;;
          esac
          exit "$missing"

      # 서명 인증서는 외부 액션에 넘기지 않고 macOS 기본 security 명령으로 임시 키체인에 넣는다.
      # IOS_CERT_P12, IOS_PROVISIONING_PROFILE 시크릿은 base64로 인코딩한 값이어야 한다.
      - name: Import signing identities and provisioning profiles
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install profile and configure Runner release signing
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          python3 tool/install_ios_provisioning_profile.py

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Build signed IPA
        env:
          FLUTTER_BUILD_MODE: release
        run: |
          set -o pipefail
          flutter build ipa --export-options-plist=exportOptions.plist --release --verbose 2>&1 | tee build_ipa_verbose.log

      - name: Collect IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memoria-ios-ipa
          path: build/ios/ipa

      - name: Upload build logs
        if: ${{ always() && hashFiles('build_ipa_verbose.log') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memoria-ipa-logs
          path: build_ipa_verbose.log

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
