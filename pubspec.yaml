name: memoria
description: AI-powered custom photo filter app with on-device LUT generation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Storage & Files
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Image handling
  image_picker: ^1.1.2
  image: ^4.1.7

  # Ads
  google_mobile_ads: ^5.1.0

  # AI / TFLite
  tflite_flutter: ^0.12.1

  # Network (model download)
  http: ^1.2.1
  crypto: ^3.0.3

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/luts/
    - assets/icons/
    - assets/models/
    - assets/overlays/
    - assets/overlays/grain/
    - assets/overlays/luts/
    - assets/overlays/curves/
    - assets/overlays/grunge/
    - assets/frames/

  fonts:
    - family: AmaticSC
      fonts:
        - asset: assets/fonts/AmaticSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/AmaticSC-Bold.ttf
          weight: 700
    - family: Dosis
      fonts:
        - asset: assets/fonts/Dosis-Light.ttf
          weight: 300
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico.ttf
          weight: 400
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
  # fonts:  # Uncomment after placing Pretendard font files in assets/fonts/
  #   - family: Pretendard
