name: memoria
description: AI-powered custom photo filter app with on-device LUT generation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management

  # Navigation
  go_router: ^13.2.0

  # Storage & Files
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Image handling
  image_picker: ^1.1.2
  photo_manager: ^3.7.1
  image: ^4.1.7

  # Ads
  google_mobile_ads: ^9.1.0

  # AI / LiteRT (SPM-capable successor to tflite_flutter)
  flutter_litert: ^3.8.0

  # Network (model download)
  http: ^1.2.1
  crypto: ^3.0.3

  # Permissions
  permission_handler: ^11.3.1

  # Gallery save
  gal: ^2.3.0

  # Network status
  connectivity_plus: ^6.0.5
  share_plus: ^10.1.0

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/luts/
    - assets/icons/
    - assets/models/
    - assets/overlays/
    - assets/overlays/grain/
    - assets/overlays/luts/
    - assets/overlays/curves/
    - assets/overlays/grunge/
    - assets/frames/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: AmaticSC
      fonts:
        - asset: assets/fonts/AmaticSC-Regular.ttf
        - asset: assets/fonts/AmaticSC-Bold.ttf
          weight: 700
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
    - family: Dosis
      fonts:
        - asset: assets/fonts/Dosis-Light.ttf
